# File settings use source-relative globs, including the .j2 suffix.
# Exact paths win, followed by the first matching pattern; settings are not merged.
# A trailing slash matches directories only; the empty key configures the root.
- name: Create directories
  ansible.builtin.file:
    path: "{{ target }}/{{ item.path }}"
    state: directory
    owner: "{{ settings.owner | default(omit) }}"
    group: "{{ settings.group | default(omit) }}"
    mode: "{{ settings.mode | default('755', true) }}"
    recurse: "{{ settings.recurse | default(omit) }}"
  vars:
    settings: >-
      {{
        files[item.path] |
        default(glob_candidates | first) |
        default(None)
      }}
    glob_candidates_yaml: |
      {% for entry in files | ansible.builtin.dict2items %}
      {% if item.path is globmatch(entry.key, item.state) %}
      - # For debugging, the key of the following object is: {{ entry.key }}.
        {{ entry.value }}
      {% endif %}
      {% endfor %}
    glob_candidates: >-
      {{
        glob_candidates_yaml |
        ansible.builtin.from_yaml |
        default([], true) |
        list
      }}
    root_directory: >-
      {{
        {
          'path': '',
          'state': 'directory'
        }
      }}
  loop: >-
    {{
      [root_directory] +
      lookup('community.general.filetree',
             directory,
             wantlist = true) |
      selectattr('state', 'eq', 'directory')
    }}
  loop_control:
    label: "{{ item.path }}{{ ' settings=' ~ settings if settings }}"
  register: copy_template_directory_results

- name: Copy non-template files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ target }}/{{ settings.rename | default(item.path) }}"
    owner: "{{ settings.owner | default(omit) }}"
    group: "{{ settings.group | default(omit) }}"
    mode: "{{ settings.mode | default('preserve', true) }}"
  vars:
    settings: >-
      {{
        files[item.path] |
        default(glob_candidates | first) |
        default(None)
      }}
    glob_candidates_yaml: |
      {% for entry in files | ansible.builtin.dict2items %}
      {% if item.path is globmatch(entry.key, item.state) %}
      - # For debugging, the key of the following object is: {{ entry.key }}.
        {{ entry.value }}
      {% endif %}
      {% endfor %}
    glob_candidates: >-
      {{
        glob_candidates_yaml |
        ansible.builtin.from_yaml |
        default([], true) |
        list
      }}
  loop: >-
    {{
      lookup('community.general.filetree',
             directory,
             wantlist = true) |
      selectattr('state', 'eq', 'file') |
      rejectattr('path', 'ansible.builtin.search', '\.j2$') |
      rejectattr('path', 'ansible.builtin.search', '/\.gitignore$')
    }}
  loop_control:
    label: "{{ item.path }}{{ ' settings=' ~ settings if settings }}"
  register: copy_template_file_results

- name: Copy template files
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: >-
      {{
        target
      }}/{{
        settings.rename |
        default(
          item.path | ansible.builtin.regex_replace('\.j2$', '')
        )
      }}
    owner: "{{ settings.owner | default(omit) }}"
    group: "{{ settings.group | default(omit) }}"
    mode: "{{ settings.mode | default('preserve', true) }}"
    lstrip_blocks: true
  vars:
    settings: >-
      {{
        files[item.path] |
        default(glob_candidates | first) |
        default(None)
      }}
    glob_candidates_yaml: |
      {% for entry in files | ansible.builtin.dict2items %}
      {% if item.path is globmatch(entry.key, item.state) %}
      - # For debugging, the key of the following object is: {{ entry.key }}.
        {{ entry.value }}
      {% endif %}
      {% endfor %}
    glob_candidates: >-
      {{
        glob_candidates_yaml |
        ansible.builtin.from_yaml |
        default([], true) |
        list
      }}
  loop: >-
    {{
      lookup('community.general.filetree',
             directory,
             wantlist = true) |
      selectattr('state', 'eq', 'file') |
      selectattr('path', 'ansible.builtin.search', '\.j2$') |
      rejectattr('path', 'ansible.builtin.search', '/\.gitignore$')
    }}
  loop_control:
    label: "{{ item.path }}{{ ' settings=' ~ settings if settings }}"
  register: copy_template_template_results

- name: Notify changed template groups
  when: copy_template_notifications | length > 0
  ansible.builtin.debug:
    msg: "{{ copy_template_notifications | ansible.builtin.to_nice_yaml }}"
  vars:
    copy_template_changed_results: >-
      {{
        (
          copy_template_directory_results.results +
          copy_template_file_results.results +
          copy_template_template_results.results
        ) |
        selectattr('changed') |
        list
      }}
    copy_template_notifications_yaml: |
      {% for result in copy_template_changed_results %}
      {% set item = result.item %}
      {% set glob_candidates_yaml %}
      {% for entry in files | ansible.builtin.dict2items %}
      {% if item.path is globmatch(entry.key, item.state) %}
      - {{ entry.value | ansible.builtin.to_json }}
      {% endif %}
      {% endfor %}
      {% endset %}
      {% set settings =
          files[item.path] |
          default(
            glob_candidates_yaml |
            ansible.builtin.from_yaml |
            default([], true) |
            first
          ) |
          default({})
      %}
      {% set notification =
          settings.notify_
          if 'notify_' in settings
          else notify_ | default(none)
      %}
      {% if notification is string and notification != omit and notification | length > 0 %}
      - {{ notification | ansible.builtin.to_json }}
      {% elif notification is sequence %}
      {% for handler in notification %}
      - {{ handler | ansible.builtin.to_json }}
      {% endfor %}
      {% endif %}
      {% endfor %}
    copy_template_notifications: >-
      {{
        copy_template_notifications_yaml |
        ansible.builtin.from_yaml |
        default([], true) |
        ansible.builtin.unique |
        list
      }}
  changed_when: true
  notify: "{{ copy_template_notifications }}"
