name: Affected roles

on:
  pull_request:

jobs:
  affected-roles:
    name: Determine roles affected by the PR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Get full commit history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # We don't need the file contents (blobs), but we inspect commits and
          # trees.
          # This in combination with a bare repo would be even faster, but it's
          # not supported.
          # https://github.com/actions/checkout/issues/603
          filter: blob:none

      - name: Determine roles from affected files
        id: affected-roles
        uses: ./.github/actions/affected-roles
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}

      - name: Set role labels
        if: steps.affected-roles.outputs.roles != ''
        run: |
          for role in $ROLES; do
            label="role:$role"
            gh label create "$label" --color fbca04 --force
            gh issue edit "$PR_NUMBER" --add-label "$label"
          done
        env:
          ROLES: ${{ steps.affected-roles.outputs.roles }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}

      - name: Trigger review of breaking changes
        if: steps.affected-roles.outputs.roles != ''
        uses: mshick/add-pr-comment@v3.12.0
        with:
          repo-token: ${{ secrets.PR_COMMENT_TOKEN }}
          message: |
            @codex review
