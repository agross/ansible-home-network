name: Run Ansible
run-name: '${{ inputs.tags }} · ${{ inputs.source }}'

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Tags to apply (comma-separated)
        required: true
        type: string
      revision:
        description: Commit SHA to deploy (defaults to the selected ref).
        required: false
        type: string
      source:
        description: Deployment origin.
        default: Manual
        type: string

permissions:
  contents: read

jobs:
  ansible:
    strategy:
      # Continue the other site's job if this site fails.
      fail-fast: false
      matrix:
        site:
          - home
          - ogd

    name: ${{ matrix.site }}

    runs-on:
      - self-hosted
      - ${{ matrix.site }}

    container:
      image: ghcr.io/agross/ansible-ee:2.21.5-1
      # --tty for unbuffered output.
      options: --tty

    defaults:
      run:
        # The container image provides bash.
        shell: bash

    cache-mode: write

    steps:
      - name: Get deployment code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          submodules: recursive

      - name: Save SSH keyfile
        run: |
          printf '%s' "$SSH_PRIVATE_KEY" > .ansible-ssh-private-key
          chmod 600 .ansible-ssh-private-key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Save ansible vault password for vault ID "agross2"
        run: |
          printf '%s' "$ANSIBLE_VAULT_AGROSS2" > .ansible-vault-agross2
          chmod 600 .ansible-vault-agross2
        env:
          ANSIBLE_VAULT_AGROSS2: ${{ secrets.ANSIBLE_VAULT_AGROSS2 }}

      - uses: actions/cache@v6
        with:
          path: ~/.ansible
          # Look to see if there is a cache hit for the corresponding
          # requirements file.
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('**/requirements*.yml') }}

      - name: Install Ansible dependencies
        # ansible-galaxy role install does not install updates unless `--force`d.
        run: |
          ansible-galaxy role \
                         install \
                         --role-file requirements.yml \
                         --force

          ansible-galaxy collection \
                         install \
                         --requirements-file requirements.yml

      - name: Gather facts
        run: |
          ./gather-facts "$SITE" \
                         --user agross \
                         --key-file .ansible-ssh-private-key || {
            exit_code=$?
            # Exit code 4 means some hosts were unreachable.
            if [ "$exit_code" -ne 4 ]; then
              exit "$exit_code"
            fi
          }
        env:
          ANSIBLE_VAULT_IDENTITY_LIST: agross2@.ansible-vault-agross2
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_FORCE_COLOR: True
          SITE: ${{ matrix.site }}

      - name: Run Ansible
        run: |
          ansible-playbook "$SITE.yml" \
                           --tags "$TAGS" \
                           --user agross \
                           --key-file .ansible-ssh-private-key
        env:
          ANSIBLE_VAULT_IDENTITY_LIST: agross2@.ansible-vault-agross2
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_FORCE_COLOR: True
          SITE: ${{ matrix.site }}
          TAGS: ${{ inputs.tags }}

      - name: Clean up secrets
        if: always()
        run: |
          rm --force \
             .ansible-ssh-private-key \
             .ansible-vault-agross2
