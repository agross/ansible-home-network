name: Run Ansible
run-name: '${{ inputs.tags }} · ${{ inputs.source }}'

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Tags to apply (comma-separated)
        required: true
        type: string
      revision:
        description: Commit SHA to deploy (defaults to the selected ref).
        required: false
        type: string
      source:
        description: Deployment origin.
        default: Manual
        type: string
      pull-request:
        description: Associated pull request number, if any.
        type: string

permissions:
  contents: read

jobs:
  ansible:
    strategy:
      # Continue the other site's job if this site fails.
      fail-fast: false
      matrix:
        site:
          - home
          - ogd

    name: ${{ matrix.site }}

    runs-on:
      - self-hosted
      - ${{ matrix.site }}

    container:
      image: ghcr.io/agross/ansible-ee:2.22.0-6
      # --tty for unbuffered output.
      options: --tty

    defaults:
      run:
        # The container image provides bash.
        shell: bash

    cache-mode: write

    steps:
      - name: Get deployment code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.revision || github.sha }}
          submodules: recursive

      - name: Save SSH keyfile
        run: |
          printf '%s' "$SSH_PRIVATE_KEY" > .ansible-ssh-private-key
          chmod 600 .ansible-ssh-private-key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Save ansible vault password for vault ID "agross2"
        run: |
          printf '%s' "$ANSIBLE_VAULT_AGROSS2" > .ansible-vault-agross2
          chmod 600 .ansible-vault-agross2
        env:
          ANSIBLE_VAULT_AGROSS2: ${{ secrets.ANSIBLE_VAULT_AGROSS2 }}

      - uses: actions/cache@v6
        with:
          path: ~/.ansible
          # Look to see if there is a cache hit for the corresponding
          # requirements file.
          key: ${{ runner.os }}-ansible-galaxy-${{ hashFiles('**/requirements*.yml') }}

      - name: Install Ansible dependencies
        # ansible-galaxy role install does not install updates unless `--force`d.
        run: |
          ansible-galaxy role \
                         install \
                         --role-file requirements.yml \
                         --force

          ansible-galaxy collection \
                         install \
                         --requirements-file requirements.yml
        env:
          ANSIBLE_COLLECTIONS_ON_ANSIBLE_VERSION_MISMATCH: ignore

      - name: Gather facts
        run: |
          ./gather-facts "$SITE" \
                         --user agross \
                         --key-file .ansible-ssh-private-key || {
            exit_code=$?
            # Exit code 4 means some hosts were unreachable.
            if [ "$exit_code" -ne 4 ]; then
              exit "$exit_code"
            fi
          }
        env:
          ANSIBLE_VAULT_IDENTITY_LIST: agross2@.ansible-vault-agross2
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_FORCE_COLOR: True
          SITE: ${{ matrix.site }}

      - name: Run Ansible
        run: |
          ansible-playbook "$SITE.yml" \
                           --tags "$TAGS" \
                           --user agross \
                           --key-file .ansible-ssh-private-key
        env:
          ANSIBLE_VAULT_IDENTITY_LIST: agross2@.ansible-vault-agross2
          ANSIBLE_HOST_KEY_CHECKING: False
          ANSIBLE_FORCE_COLOR: True
          SITE: ${{ matrix.site }}
          TAGS: ${{ inputs.tags }}

      - name: Clean up secrets
        if: always()
        run: |
          rm --force \
             .ansible-ssh-private-key \
             .ansible-vault-agross2

  report-failure:
    name: Report deployment failure
    needs: ansible
    if: failure()
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: read

    steps:
      - name: Report the failed run on GitHub
        shell: bash
        run: |
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          report="$RUNNER_TEMP/ansible-failure.md"
          {
            printf '[Run Ansible failed (attempt %s)](%s/attempts/%s).\n' \
              "$GITHUB_RUN_ATTEMPT" "$run_url" "$GITHUB_RUN_ATTEMPT"
            printf '\nDeployment source\n\n'
            printf '%s\n' "$DEPLOYMENT_SOURCE" | sed --expression='s/^/    /'
          } > "$report"

          pr_comment_status=0
          if [[ -n "$DEPLOYMENT_PR" ]]; then
            if [[ ! "$DEPLOYMENT_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo '::error::The associated pull request must be a positive integer.'
              exit 1
            fi

            merger_type=''
            if merger="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$DEPLOYMENT_PR" \
                           --jq '.merged_by | [.type, .login] | @tsv')"; then
              IFS=$'\t' read -r merger_type merger_login <<< "$merger"
              if [[ "$merger_type" == User && -n "$merger_login" ]]; then
                printf '\n@%s\n' "$merger_login" >> "$report"
              fi
            else
              echo '::warning::Could not determine who merged the pull request.'
            fi

            gh pr comment "$DEPLOYMENT_PR" --repo "$GITHUB_REPOSITORY" --body-file "$report" || pr_comment_status=$?
            if [[ "$merger_type" != Bot ]]; then
              exit "$pr_comment_status"
            fi

            printf '\nPull request: %s/%s/pull/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$DEPLOYMENT_PR" >> "$report"
          fi

          # Find the existing issue by run ID, which is stable across attempts.
          title="Run Ansible failed (run $GITHUB_RUN_ID)"
          marker="<!-- run-ansible-run:$GITHUB_RUN_ID -->"
          issues="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues?state=all&per_page=100" \
                     --jq "first(.[] | select(.pull_request == null and .user.login == \"github-actions[bot]\" and
                                                ((.body // \"\") | contains(\"$marker\"))) | .number) // empty")"
          issue="${issues%%$'\n'*}"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          else
            printf '\n%s\n' "$marker" >> "$report"
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$report"
          fi

          exit "$pr_comment_status"
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_PR: ${{ inputs.pull-request }}
          DEPLOYMENT_SOURCE: ${{ inputs.source }}
