name: Dispatch Ansible

on:
  pull_request:
    types:
      - closed
  push:
    branches:
      - master

jobs:
  affected-roles:
    name: Determine affected roles
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    # Renovate triggers branch automerge pushes committed by GitHub. Rebased PR
    # pushes are triggered and committed by the user who merged the PR.
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.merged == true &&
        !contains(github.event.pull_request.labels.*.name, 'skip-ansible')
      ) || (
        github.event_name == 'push' &&
        github.actor == 'agross-renovate[bot]' &&
        github.event.head_commit.committer.name == 'GitHub' &&
        github.event.head_commit.committer.email == 'noreply@github.com'
      )

    env:
      EVENT_NAME: ${{ github.event_name }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
      PUSH_BASE_SHA: ${{ github.event.before }}
      PUSH_HEAD_SHA: ${{ github.event.after }}

    steps:
      - name: Get full commit history
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          # We don't need the file contents (blobs), but we inspect commits and
          # trees.
          # This in combination with a bare repo would be even faster, but it's
          # not supported.
          # https://github.com/actions/checkout/issues/603
          filter: blob:none

      - name: Download original PR branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "$PR_HEAD_SHA"

      # If merging the PR caused a rebase (because new commits have been added
      # to the PR target branch before the PR was merged):
      # The pull_request.base.sha points to PR target branch commit before the
      # rebase. The pull_request.head.sha denotes the last commit on the
      # PR branch before the PR was rebased.
      - name: Compute base commit
        id: base-commit
        run: |
          {
            echo 'sha<<SHA'

            if [[ "$EVENT_NAME" == pull_request ]]; then
              echo "pull_request.base.sha=$PR_BASE_SHA" >&2
              echo "pull_request.merge_commit_sha=$PR_MERGE_SHA" >&2
              echo "pull_request.head.sha=$PR_HEAD_SHA" >&2

              git merge-base "$PR_MERGE_SHA" "$PR_HEAD_SHA"
            else
              echo "push.before=$PUSH_BASE_SHA" >&2
              echo "push.after=$PUSH_HEAD_SHA" >&2

              echo "$PUSH_BASE_SHA"
            fi

            echo SHA
          } >> "$GITHUB_OUTPUT"

      - name: Determine roles from affected files
        id: affected-roles
        uses: ./.github/actions/affected-roles
        with:
          base-sha: ${{ steps.base-commit.outputs.sha }}
          head-sha: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.head.sha ||
              github.event.after
            }}
          delimiter: ','

      - name: Determine deployment source
        id: deployment-source
        if: steps.affected-roles.outputs.roles != ''
        run: |
          title="${DEPLOYMENT_TITLE%%$'\n'*}"
          source="$DEPLOYMENT_SOURCE"
          pr_suffix=' \(#([0-9]+)\)$'
          if [[ "$EVENT_NAME" == push && "$title" =~ $pr_suffix ]]; then
            source="PR #${BASH_REMATCH[1]}"
            title="${title%"${BASH_REMATCH[0]}"}"
          fi
          if [[ "$title" == 'Update '* ]]; then
            title="$(printf '%s' "$title" |
              sed --regexp-extended \
                  --expression='s/^Update (dependency )?//' \
                  --expression='s/ (Docker tag |Docker digest |action |digest )?to / /')"
          fi
          source="$title · $source"
          printf 'source=%s\n' "$source" >> "$GITHUB_OUTPUT"
        env:
          DEPLOYMENT_TITLE: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.title ||
              github.event.head_commit.message
            }}
          DEPLOYMENT_SOURCE: >-
            ${{
              github.event_name == 'pull_request' &&
              format('PR #{0}', github.event.pull_request.number) ||
              'Renovate branch automerge'
            }}

      - name: Dispatch Ansible
        if: steps.affected-roles.outputs.roles != ''
        run: |
          gh workflow run run-ansible.yaml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$DEFAULT_BRANCH" \
            --raw-field "tags=$DEPLOYMENT_TAGS" \
            --raw-field "revision=$DEPLOYMENT_REVISION" \
            --raw-field "source=$DEPLOYMENT_SOURCE"
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DEPLOYMENT_TAGS: ${{ steps.affected-roles.outputs.roles }}
          DEPLOYMENT_REVISION: >-
            ${{
              github.event_name == 'pull_request' &&
              github.event.pull_request.merge_commit_sha ||
              github.event.after
            }}
          DEPLOYMENT_SOURCE: ${{ steps.deployment-source.outputs.source }}
