hermes_root: /data/hermes-agent

hermes_timezone: Europe/Berlin

hermes_uid: 10000
hermes_gid: 10000

hermes_native_approvals_mode: manual
hermes_native_approvals_cron_mode: deny

hermes_browser_tools_enabled: false
hermes_shm_size: 1g

# Web dashboard.
hermes_dashboard_enabled: false
hermes_dashboard_port: 9119
hermes_dashboard_basic_auth_username: hermes
hermes_dashboard_basic_auth_password: ""

# OpenAI-compatible API server.
hermes_api_server_enabled: false
hermes_api_server_port: 8642
hermes_api_server_key: ""
hermes_api_server_cors_origins: ""

# Webhooks.
hermes_webhooks_enabled: false
hermes_webhooks_port: 8644
