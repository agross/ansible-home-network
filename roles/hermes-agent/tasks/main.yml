- name: Install scripts
  ansible.builtin.template:
    src: "templates/bin/{{ item }}.j2"
    dest: "/usr/local/bin/{{ item }}"
    owner: 0
    group: 0
    mode: "755"
  loop:
    - hermes

- name: Ensure backup healthcheck exists
  ansible.builtin.import_tasks:
    file: healthcheck.yml
  vars:
    healthcheck_name: "{{ ansible_role_name }}"
    healthcheck_tags:
      - "site:{{ site }}"
      - "host:{{ inventory_hostname }}"

- name: Check whether the Hermes config exists
  ansible.builtin.stat:
    path: "{{ hermes_root }}/app/config.yaml"
    get_checksum: false
  register: hermes_config_stat

- name: Read the live Hermes config
  when: hermes_config_stat.stat.exists
  ansible.builtin.slurp:
    src: "{{ hermes_root }}/app/config.yaml"
  register: hermes_config_slurp
  no_log: true

- name: Copy templates
  ansible.builtin.import_tasks: copy-templates.yml
  vars:
    paths:
      - >-
        {{ playbook_dir }}/templates/{{
          ansible_role_name
        }}/{{
          inventory_hostname
        }}/templates
    directory: "{{ lookup('ansible.builtin.first_found', paths, skip=false) }}"
    target: "{{ hermes_root }}"
    notify_: Restart hermes-agent service
    # Hermes adds a _config_version key to the config file on startup. If the
    # config file already exists, we want to avoid overwriting it unless the
    # settings have changed.
    hermes_live_config: >-
      {{
        hermes_config_slurp.content |
        ansible.builtin.b64decode |
        ansible.builtin.from_yaml
      }}
    hermes_rendered_config: >-
      {{
        lookup('ansible.builtin.template', directory ~ '/app/config.yaml.j2') |
        ansible.builtin.from_yaml
      }}
    files:
      app:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "700"
      app/config.yaml.j2:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "640"
        # Hermes stamps the file on startup. Compare settings before allowing a
        # write.
        force: >-
          {{
            not hermes_config_stat.stat.exists or
            hermes_live_config is not mapping or
            (
              hermes_live_config |
              ansible.builtin.dict2items |
              rejectattr('key', 'equalto', '_config_version') |
              ansible.builtin.items2dict |
              ansible.builtin.to_json(sort_keys = true)
            ) !=
            (hermes_rendered_config | ansible.builtin.to_json(sort_keys = true))
          }}
      app/.env.j2:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "600"
      app/profiles/*/config.yaml.j2:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "640"
      app/profiles/*/.env.j2:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "600"
      app/profiles/*/*.pem:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "600"
      app/profiles/*/skills/**/*:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "700"
        # Do not overwrite skills if they already exist, as they may have been
        # modified by the agent.
        force: false

      app/profiles/**/*/:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "700"

      anytype/home/config.json:
        owner: 0
        group: 0
        mode: "600"
        notify_: null

      app/profiles/**/gh/hosts.yml.j2:
        owner: "{{ hermes_uid }}"
        group: "{{ hermes_gid }}"
        mode: "600"

      docker-compose.yaml.j2:
        owner: 0
        group: 0
        mode: "600"
        notify_: Reload hermes-agent service

- name: Enforce permissions on the existing Hermes config
  when: hermes_config_stat.stat.exists
  ansible.builtin.file:
    path: "{{ hermes_root }}/app/config.yaml"
    state: file
    owner: "{{ hermes_uid }}"
    group: "{{ hermes_gid }}"
    mode: "640"

- name: Update docker-compose images
  ansible.builtin.import_tasks: docker-compose-update.yml
  vars:
    directory: "{{ hermes_root }}"
    pull: true
    build: true
    notify_: Reload hermes-agent service

- name: Restore from backup if requested
  when: restore is defined
  ansible.builtin.import_tasks:
    file: restore.yml
  vars:
    restore_target_dir: "{{ hermes_root }}"

- name: Symlink backup configuration
  ansible.builtin.file:
    state: link
    src: "{{ hermes_root }}/backup.yaml"
    path: "/etc/borgmatic.d/{{ ansible_role_name }}.yaml"

- name: Install systemd units
  ansible.builtin.import_tasks: systemd-install-units.yml
  vars:
    directory: "{{ hermes_root }}/systemd"
    paths:
      - >-
        {{ playbook_dir }}/templates/{{
          ansible_role_name
        }}/{{
          inventory_hostname
        }}/templates/systemd
      - templates/systemd
    local_units: "{{ lookup('ansible.builtin.first_found', paths, skip=false) }}"
    notify_: Restart hermes-agent service

- name: Start service
  ansible.builtin.systemd:
    state: started
    enabled: true
    name: "{{ item }}"
    daemon_reload: true
  loop: "{{ systemd_units_autostart }}"
  register: hermes_started

- name: Register with loadbalancer
  ansible.builtin.import_tasks:
    file: register-with-loadbalancer.yml

- name: Host-specific post configuration
  ansible.builtin.include_tasks:
    file: "{{ tasks_file }}"
  loop_control:
    loop_var: tasks_file
  loop: "{{ query('ansible.builtin.fileglob', glob) | sort }}"
  vars:
    glob: >-
      {{ playbook_dir }}/templates/{{
        ansible_role_name
      }}/{{
        inventory_hostname
      }}/ansible/post-config.d/*.yml
