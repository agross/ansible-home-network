- name: Restart dyndns-updater timer
  when: gateway_dyndns_updater_timer_started is not changed
  ansible.builtin.systemd:
    name: dyndns-updater.timer
    state: restarted

- name: Restart wireguard-resolve-endpoint timer
  when: gateway_wireguard_resolve_endpoint_timer_started is not changed
  ansible.builtin.systemd:
    name: wireguard-resolve-endpoint.timer
    state: restarted

- name: Restart gateway MSS clamp
  ansible.builtin.systemd_service:
    name: gateway-mss.service
    state: restarted
