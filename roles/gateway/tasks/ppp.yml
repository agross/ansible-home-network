- name: Ensure ppp is installed
  ansible.builtin.package:
    name: ppp
    state: present

- name: Configure PPP ip-up hooks
  ansible.builtin.import_tasks: ppp-ip-up.yml

- name: Ensure pppd configuration directory exists
  ansible.builtin.file:
    path: /etc/ppp/peers
    state: directory
    owner: 0
    group: 0
    mode: "755"

# https://forum.vyos.io/t/pppoe-client-with-vlan7-deutsche-telekom-viperoptic/6502/6
- name: Copy PPPoE connection config file
  ansible.builtin.template:
    src: "templates/pppd/{{ gateway_interface }}.j2"
    dest: "/etc/ppp/peers/{{ gateway_interface }}"
    owner: 0
    group: 0
    mode: "640"

- name: Copy PPPoE connection service
  ansible.builtin.template:
    src: templates/pppoe@.service.j2
    dest: "/etc/systemd/system/{{ gateway_pppoe_service }}"
    owner: 0
    group: 0
    mode: "644"

- name: Enable and start PPPoE connection service
  ansible.builtin.systemd:
    name: "{{ gateway_pppoe_service }}"
    state: started
    no_block: true
    enabled: true
    daemon_reload: true
