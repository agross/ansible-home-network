- name: Ensure nftables configuration directory exists
  ansible.builtin.file:
    path: /etc/nftables
    state: directory
    owner: 0
    group: 0
    mode: "700"

- name: Install TCP MSS clamp rules
  ansible.builtin.template:
    src: templates/gateway-mss.nft.j2
    dest: /etc/nftables/gateway-mss.nft
    owner: 0
    group: 0
    mode: "644"
  notify: Restart gateway MSS clamp

- name: Install TCP MSS clamp service
  ansible.builtin.copy:
    src: files/gateway-mss.service
    dest: /etc/systemd/system/gateway-mss.service
    owner: 0
    group: 0
    mode: "644"
  notify: Restart gateway MSS clamp

- name: Enable and start TCP MSS clamp service
  ansible.builtin.systemd_service:
    name: gateway-mss.service
    enabled: true
    state: started
    daemon_reload: true
