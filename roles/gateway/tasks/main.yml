- name: Configure PPPoE
  ansible.builtin.import_tasks: ppp.yml

- name: Configure TCP MSS clamp
  ansible.builtin.import_tasks: mss-clamp.yml

- name: Configure dyndns-updater
  ansible.builtin.import_tasks: dyndns-updater.yml

- name: Configure WireGuard
  ansible.builtin.import_tasks: wireguard.yml

- name: Install scripts
  ansible.builtin.template:
    src: "templates/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    owner: 0
    group: 0
    mode: "755"
  loop:
    - block
    - speed
