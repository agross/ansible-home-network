proxmox:
  host: pve-home
  type: kvm
  id: 105
  tags:
    - service
  startup: order=200
  cores: 8
  memory: 12288
  net:
    net0: virtio,bridge=vmbr0,firewall=1
  efi_disk:
    storage: local-zfs
  scsi:
    scsi0:
      storage: local-zfs
      size: 60
      discard: true
      iothread: true
      ssd: true
  usb:
    # Sonoff Zigbee stick.
    usb0: host=10c4:ea60
