- name: Configure GitHub webhooks for GROSSWEBER/aqbanking-sql
  community.general.github_webhook:
    repository: GROSSWEBER/aqbanking-sql
    url: >-
      https://hooks.{{
        hermes_domain
      }}/p/{{
        item.profile | replace('_', '-')
      }}/webhooks/{{
        item.route
      }}
    content_type: json
    events: "{{ item.events }}"
    user: "{{ hermes_profile[item.profile].github.webhook.management.username }}"
    token: "{{ hermes_profile[item.profile].github.webhook.management.token }}"
    secret: "{{ hermes_profile[item.profile].github.webhook.secret }}"
  become: false
  loop:
    - route: gw-github-issue-work
      profile: gw_developer
      events:
        - issues
    - route: gw-github-pr-developer-handoff
      profile: gw_developer
      events:
        - pull_request
    - route: gw-github-pr-review
      profile: gw_reviewer
      events:
        - pull_request
    - route: gw-github-review-feedback
      profile: gw_developer
      events:
        - pull_request_review
        - pull_request_review_comment
  loop_control:
    label: "{{ item.route }}: {{ item.events | join(', ') }} to {{ item.profile }}"
